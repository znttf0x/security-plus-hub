<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Security+ study platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d1c33"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0.2" y1="0" x2="0.8" y2="1">
