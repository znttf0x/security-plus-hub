  <!-- capa do livro -->
  <path d="M256 312 C 230 288, 192 276, 162 276 L 162 380 C 200 380, 234 392, 256 412
           C 278 392, 312 380, 350 380 L 350 276 C 320 276, 282 288, 256 312 Z"
