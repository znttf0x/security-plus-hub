  <!-- cruz -->
  <path d="M241 148 h30 a9 9 0 0 1 9 9 v25 h25 a9 9 0 0 1 9 9 v30 a9 9 0 0 1 -9 9 h-25 v25 a9 9 0 0 1 -9 9 h-30 a9 9 0 0 1 -9 -9 v-25 h-25 a9 9 0 0 1 -9 -9 v-30 a9 9 0 0 1 9 -9 h25 v-25 a9 9 0 0 1 9 -9 Z"
